name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: false

    - name: Recreate android folder
      run: flutter create --platforms=android .

    - name: Force Fix Android Embedding
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="${applicationName}"/g' $MANIFEST
        if ! grep -q 'flutterEmbedding' $MANIFEST; then
          sed -i 's/<application/<application\n        <meta-data android:name="flutterEmbedding" android:value="2" \/>/' $MANIFEST
        fi

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
